name: Apply Verified Unified Drawing Patch
on:
  push:
    branches: ["feat/v0.1.11-unified-drawing-snap"]
    paths: [".github/workflows/apply-drawing0111.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify complete source transport before applying
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          parts = sorted(pathlib.Path('bootstrap/drawing0111').glob('part*'))
          assert len(parts) == 4
          encoded = b''.join(b''.join(p.read_bytes().split()) for p in parts)
          assert len(encoded) == 36000, len(encoded)
          compressed = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(compressed).hexdigest()
          assert digest == '89e3ae01343ba9bdd02a5c07f7ae2f8112d43e6293a28c12f4c90ba2ce9e1eac', digest
          payload = lzma.decompress(compressed)
          assert len(payload) == 115713
          pathlib.Path('/tmp/drawing0111.patch').write_bytes(payload)
          print('COMPLETE_PATCH_VERIFIED', digest)
          PY
          git apply --check /tmp/drawing0111.patch
          git apply /tmp/drawing0111.patch
      - name: Test and build twice before committing source
        run: |
          set -euo pipefail
          python -m pip install pytest
          python tools/sync_core_into_extension.py
          pytest -q
          python -m compileall -q src extension tools
          python tools/build_extension.py
          P="$(python tools/release_meta.py package-name)"
          cp "dist/$P" "$RUNNER_TEMP/first.zip"
          python tools/build_extension.py
          cmp "$RUNNER_TEMP/first.zip" "dist/$P"
      - name: Commit full implementation and remove transfer staging
        run: |
          set -euo pipefail
          rm -rf bootstrap/drawing0111
          rm .github/workflows/apply-drawing0111.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: v0.1.11 unified drawing and movement snaps'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
