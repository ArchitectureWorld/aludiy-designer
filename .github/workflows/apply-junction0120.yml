name: Apply Verified Junction Phase One Patch
on:
  push:
    branches: ["feat/v0.1.20-joint-editor"]
    paths: [".github/workflows/apply-junction0120.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify complete source transport before applying
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,lzma,pathlib
          parts=sorted(pathlib.Path('bootstrap/junction0120').glob('part*'))
          assert len(parts)==4
          compressed=b''.join(p.read_bytes() for p in parts)
          assert len(compressed)==33384,len(compressed)
          digest=hashlib.sha256(compressed).hexdigest()
          assert digest=='1f22916793132853abd61e3627407a9c32d8ee55ee9367290be3105fa5681abd',digest
          payload=lzma.decompress(compressed)
          assert len(payload)==127902,len(payload)
          pathlib.Path('/tmp/junction0120.patch').write_bytes(payload)
          print('COMPLETE_PATCH_VERIFIED',digest)
          PY
          git apply --check /tmp/junction0120.patch
          git apply /tmp/junction0120.patch
      - name: Full Python regressions compilation and reproducible build
        run: |
          set -euo pipefail
          python -m pip install pytest
          python tools/sync_core_into_extension.py
          pytest -q
          python -m compileall -q src extension tools
          python tools/build_extension.py
          P="$(python tools/release_meta.py package-name)"
          cp "dist/$P" "$RUNNER_TEMP/first.zip"
          python tools/build_extension.py
          cmp "$RUNNER_TEMP/first.zip" "dist/$P"
      - name: Commit complete product and remove transfer staging
        run: |
          set -euo pipefail
          rm -rf bootstrap/junction0120
          rm .github/workflows/apply-junction0120.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: v0.1.20 visual L/T and three-way junction editor with full roadmap'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
