name: Publish Blender Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BLENDER_VERSION: "5.2.2"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.meta.outputs.package_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Validate release tag
        run: python tools/release_meta.py validate-tag "${GITHUB_REF_NAME}"

      - name: Run tests
        run: pytest -q

      - name: Build extension package
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_extension.py
          PACKAGE_NAME="$(python tools/release_meta.py package-name)"
          echo "package_name=${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
          test -f "dist/${PACKAGE_NAME}"

      - name: Prepare static repository files
        run: |
          python tools/build_pages_site.py \
            --package "dist/${{ steps.meta.outputs.package_name }}" \
            --output site

      - name: Download Blender CLI
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --silent --show-error \
            "https://download.blender.org/release/Blender5.2/${ARCHIVE}" \
            --output "/tmp/${ARCHIVE}"
          tar -xf "/tmp/${ARCHIVE}" -C /tmp

      - name: Generate Blender extension repository index
        shell: bash
        run: |
          set -euo pipefail
          "/tmp/blender-${BLENDER_VERSION}-linux-x64/blender" \
            --command extension server-generate \
            --repo-dir="${GITHUB_WORKSPACE}/site" \
            --html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aludiy-designer-${{ github.ref_name }}
          path: |
            dist/${{ steps.meta.outputs.package_name }}
            site/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE="dist/${{ steps.meta.outputs.package_name }}"
          CHECKSUM="site/SHA256SUMS.txt"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${PACKAGE}" "${CHECKSUM}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${PACKAGE}" "${CHECKSUM}" \
              --title "AluDIY Designer ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
