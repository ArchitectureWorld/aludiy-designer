name: Prepare verified developer runtime
on:
  push:
    branches: ["feat/v0.1.18-copy-action-wheel"]
    paths: [".github/workflows/dev-runtime-toolchain.yml"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download and verify official Blender 5.2.2
        run: |
          set -euo pipefail
          mkdir runtime
          cd runtime
          curl -fL --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256 -o official.sha256
          grep -F blender-5.2.2-linux-x64.tar.xz official.sha256 | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: official-blender-runtime
          path: runtime/
          retention-days: 1
          compression-level: 0
