name: Apply Sample Safety Patch
on:
  push:
    branches: ["fix/v0.1.8-sample-safety"]
    paths: [".github/workflows/apply-sample-safety.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply bounded source edit and validate
        run: |
          set -euo pipefail
          python tools/apply_sample_safety_patch.py
          python - <<'PY'
          from pathlib import Path
          for name in ['test_manifest.py', 'test_package.py']:
              p = Path('tests/extension') / name
              s = p.read_text(encoding='utf-8')
              assert '"0.1.7"' in s
              p.write_text(s.replace('"0.1.7"', '"0.1.8"'), encoding='utf-8')
          PY
          python -m pip install pytest
          python tools/sync_core_into_extension.py
          pytest -q
          python -m compileall -q src extension tools
      - name: Commit tested source to fix branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix: preserve user geometry when inserting samples and guard project reset'
          git push origin "HEAD:${GITHUB_REF_NAME}"
