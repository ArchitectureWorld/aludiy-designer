name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src extension tools

      - name: Build deterministic extension twice
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(python tools/release_meta.py package-name)"
          python tools/build_extension.py
          cp "dist/${PACKAGE}" /tmp/aludiy-first.zip
          python tools/build_extension.py
          cmp /tmp/aludiy-first.zip "dist/${PACKAGE}"
