name: Diagnose v0.1.6 CI

on:
  push:
    paths:
      - ".github/workflows/diagnose-v016.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture environment and pytest output
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip pytest > /tmp/install.log 2>&1
          INSTALL_STATUS=$?
          pytest -q > /tmp/pytest.log 2>&1
          TEST_STATUS=$?
          {
            echo "python=$(python --version 2>&1)"
            echo "install_status=${INSTALL_STATUS}"
            echo "pytest_status=${TEST_STATUS}"
            echo
            echo "--- install ---"
            cat /tmp/install.log
            echo
            echo "--- pytest ---"
            cat /tmp/pytest.log
          } > ci-diagnostic-v016.txt
          exit 0
      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostic-v016.txt
          git commit -m "chore: capture v0.1.6 CI diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
