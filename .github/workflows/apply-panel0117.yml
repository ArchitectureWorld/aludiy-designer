name: Apply Verified Readonly Panel Hotfix
on:
  push:
    branches: ["fix/v0.1.17-readonly-panel"]
    paths: [".github/workflows/apply-panel0117.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify complete patch and apply
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, hashlib, lzma
          compressed=pathlib.Path('bootstrap/panel0117.patch.xz').read_bytes()
          digest=hashlib.sha256(compressed).hexdigest()
          assert digest=='9a84485aaab269332755c0566d9a27fce2014205e114a893e4251ba0124a754c',digest
          patch=lzma.decompress(compressed)
          assert len(patch)==27604,len(patch)
          pathlib.Path('/tmp/panel0117.patch').write_bytes(patch)
          print('PATCH_VERIFIED',digest)
          PY
          git apply --check /tmp/panel0117.patch
          git apply /tmp/panel0117.patch
      - name: Update progress header while retaining full feature map
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/progress/index.html');s=p.read_text()
          s=s.replace('<title>AluDIY · 0.1.16 槽轨控制台与L/T退让</title>','<title>AluDIY · 0.1.17 空白面板修复</title>')
          s=s.replace('<span>0.1.16-alpha · Preview</span>','<span>0.1.17-alpha · Preview</span>')
          s=s.replace('<main>','<main><section><span class="pill pending">0.1.17-alpha · 本机待验收</span><h2 style="margin-top:16px">空工程也能完整打开面板</h2><p>修正顶部长度读取触发场景写入、导致版本号以下内容消失的问题。读取只读，不清空工程。遇到无法读取的项目时显示诊断并保留另存与导入。</p><p><b>验收：</b>打开默认新场景 → N → AluDIY → 直接看到“当前选择”和设置双视窗等功能。无需先建项目或重装。</p><a class="button" href="https://architectureworld.github.io/aludiy-designer/aludiy_designer-0.1.17.zip">备用安装 ZIP</a></section>',1)
          s=s.replace('本版等待本机验收。','0.1.16功能继续回归，本机体验待确认。')
          p.write_text(s);Path('docs/progress/v0.1.17-alpha.html').write_text(s)
          PY
      - name: Verify tests and deterministic build before committing
        run: |
          set -euo pipefail
          python -m pip install pytest
          python tools/sync_core_into_extension.py
          pytest -q
          python -m compileall -q src extension tools
          python tools/build_extension.py
          P="$(python tools/release_meta.py package-name)"
          cp "dist/$P" "$RUNNER_TEMP/first.zip"
          python tools/build_extension.py
          cmp "$RUNNER_TEMP/first.zip" "dist/$P"
      - name: Commit complete source and remove staging
        run: |
          set -euo pipefail
          rm bootstrap/panel0117.patch.xz .github/workflows/apply-panel0117.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: v0.1.17 read-only project access and resilient empty-scene panels'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
