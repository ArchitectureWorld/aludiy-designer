name: Apply Verified Copy and Wheel Patch
on:
  push:
    branches: ["feat/v0.1.18-copy-action-wheel"]
    paths: [".github/workflows/apply-command0118.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify complete source transport before applying
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, lzma, pathlib
          parts = sorted(pathlib.Path('bootstrap/command0118').glob('part*'))
          assert len(parts) == 3
          compressed = b''.join(p.read_bytes() for p in parts)
          assert len(compressed) == 30444, len(compressed)
          digest = hashlib.sha256(compressed).hexdigest()
          assert digest == '3051c86be83dc5a65166b2bf9affc6aacbc3eec8f405793db1eb99f2d48c30b8', digest
          payload = lzma.decompress(compressed)
          assert len(payload) == 125061, len(payload)
          pathlib.Path('/tmp/command0118.patch').write_bytes(payload)
          print('COMPLETE_PATCH_VERIFIED', digest)
          PY
          git apply --check /tmp/command0118.patch
          git apply /tmp/command0118.patch
      - name: Run full source regressions and deterministic build
        run: |
          set -euo pipefail
          python -m pip install pytest
          python tools/sync_core_into_extension.py
          pytest -q
          python -m compileall -q src extension tools
          python tools/build_extension.py
          P="$(python tools/release_meta.py package-name)"
          cp "dist/$P" "$RUNNER_TEMP/first.zip"
          python tools/build_extension.py
          cmp "$RUNNER_TEMP/first.zip" "dist/$P"
      - name: Commit implementation and remove temporary transport
        run: |
          set -euo pipefail
          rm -rf bootstrap/command0118
          rm .github/workflows/apply-command0118.yml .github/workflows/dev-runtime-toolchain.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: v0.1.18 engineering duplication, stale-target cleanup and middle action wheel'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
