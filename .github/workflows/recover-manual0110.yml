name: Complete Manual Associations Upload
on:
  push:
    branches: ["feat/v0.1.10-manual-associations"]
    paths: [".github/workflows/recover-manual0110.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify complete transport before applying source
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,lzma,pathlib
          parts=sorted(pathlib.Path('bootstrap/recovery0110').glob('part*'))
          assert len(parts)==7
          encoded=b''.join(b''.join(p.read_bytes().split()) for p in parts)
          assert len(encoded)==37916,len(encoded)
          compressed=base64.b64decode(encoded,validate=True)
          digest=hashlib.sha256(compressed).hexdigest()
          assert digest=='c53895793b9d1c2c83c7ad75f973231894e117b3e3dd5c84c24f31a5543e2f4b',digest
          payload=lzma.decompress(compressed)
          assert len(payload)==110109
          pathlib.Path('/tmp/manual0110.patch').write_bytes(payload)
          print('COMPLETE_PATCH_VERIFIED',digest)
          PY
          git apply --check /tmp/manual0110.patch
          git apply /tmp/manual0110.patch
      - name: Run full source regressions and deterministic package build
        run: |
          set -euo pipefail
          python -m pip install pytest
          python tools/sync_core_into_extension.py
          pytest -q
          python -m compileall -q src extension tools
          python tools/build_extension.py
          P="$(python tools/release_meta.py package-name)"
          cp "dist/$P" "$RUNNER_TEMP/first.zip"
          python tools/build_extension.py
          cmp "$RUNNER_TEMP/first.zip" "dist/$P"
      - name: Commit complete source and remove incomplete transport
        run: |
          set -euo pipefail
          rm -rf bootstrap/recovery0110 bootstrap/manual0110
          rm .github/workflows/recover-manual0110.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete v0.1.10 selection and explicit associations'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
