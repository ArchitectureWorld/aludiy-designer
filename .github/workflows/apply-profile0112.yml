name: Apply Verified Profile Orientation Patch
on:
  push:
    branches: ["feat/v0.1.12-profile-orientation"]
    paths: [".github/workflows/apply-profile0112.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify complete source transport before applying
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          parts = sorted(pathlib.Path('bootstrap/profile0112').glob('part*'))
          assert len(parts) == 3
          encoded = b''.join(b''.join(p.read_bytes().split()) for p in parts)
          assert len(encoded) == 28780, len(encoded)
          compressed = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(compressed).hexdigest()
          assert digest == '09d352e1fc8e3dda58c7b2f9a8f082beff3b20eeae9fb3564b47c499912495e1', digest
          payload = lzma.decompress(compressed)
          assert len(payload) == 83634
          pathlib.Path('/tmp/profile0112.patch').write_bytes(payload)
          print('COMPLETE_PATCH_VERIFIED', digest)
          PY
          git apply --check /tmp/profile0112.patch
          git apply /tmp/profile0112.patch
      - name: Run full source regressions and deterministic build
        run: |
          set -euo pipefail
          python -m pip install pytest
          python tools/sync_core_into_extension.py
          pytest -q
          python -m compileall -q src extension tools
          python tools/build_extension.py
          P="$(python tools/release_meta.py package-name)"
          cp "dist/$P" "$RUNNER_TEMP/first.zip"
          python tools/build_extension.py
          cmp "$RUNNER_TEMP/first.zip" "dist/$P"
      - name: Commit implementation and remove transport staging
        run: |
          set -euo pipefail
          rm -rf bootstrap/profile0112
          rm .github/workflows/apply-profile0112.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: v0.1.12 batch profiles section orientation and slot inspector'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
