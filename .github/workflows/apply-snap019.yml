name: Apply Verified Snap Reconnect Patch
on:
  push:
    branches: ["feat/v0.1.9-snap-reconnect"]
    paths: [".github/workflows/apply-snap019.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify patch bytes before applying
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          parts = sorted(pathlib.Path('bootstrap/snap019').glob('part*'))
          assert len(parts) == 4, len(parts)
          data = b''.join(b''.join(p.read_bytes().split()) for p in parts)
          for p in parts:
              print(p.name, len(p.read_bytes()), hashlib.sha256(p.read_bytes()).hexdigest())
          assert len(data) == 35660, len(data)
          packed = base64.b64decode(data, validate=True)
          digest = hashlib.sha256(packed).hexdigest()
          assert digest == '26e5ed85009017d935663c20d8e4bed3f054b2f675afd6d87832d26f0cc3e8ea', digest
          patch = lzma.decompress(packed)
          assert len(patch) == 107810, len(patch)
          pathlib.Path('/tmp/snap019.patch').write_bytes(patch)
          print('PATCH_SHA256_OK', digest)
          PY
          git apply --check /tmp/snap019.patch
          git apply /tmp/snap019.patch
      - name: Run regressions and commit implementation
        run: |
          set -euo pipefail
          python -m pip install pytest
          python tools/sync_core_into_extension.py
          pytest -q
          python -m compileall -q src extension tools
          python tools/build_extension.py
          P="$(python tools/release_meta.py package-name)"
          cp "dist/$P" "$RUNNER_TEMP/first.zip"
          python tools/build_extension.py
          cmp "dist/$P" "$RUNNER_TEMP/first.zip"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add src/aludiy_core/snapping.py tests/core/test_snapping_reconnect.py tests/extension/test_snap_delivery.py tools/blender_gui_snap_test.py tools/blender_reopen_snap_test.py tools/blender_snap_test.py tools/verify_snapping.sh docs/acceptance/v0.1.9-alpha.md docs/acceptance/v0.1.9-verification.md docs/progress/v0.1.9-alpha.html
          git commit -m 'feat: add G snapping and transactional endpoint reconnection'
          git push origin "HEAD:${GITHUB_REF_NAME}"
