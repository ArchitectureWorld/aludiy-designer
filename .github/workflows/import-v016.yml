name: Import v0.1.6 Source

on:
  push:
    paths:
      - ".github/workflows/import-v016.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          # All six chunks are required before the one-time import starts.
          test "$(find bootstrap/v016 -maxdepth 1 -name 'source.b64.*' -type f | wc -l)" -eq 6
          cat bootstrap/v016/source.b64.* | base64 --decode > /tmp/aludiy-v016.tar.xz
          echo "f5c9095efe86e7e81c7538e2afe50e6e8d219e78e9841e110e41f1f0f0c70768  /tmp/aludiy-v016.tar.xz" | sha256sum --check
          mkdir -p /tmp/aludiy-v016
          tar -xJf /tmp/aludiy-v016.tar.xz -C /tmp/aludiy-v016

      - name: Import source tree and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/aludiy-v016/ ./
          rm -rf bootstrap/v016 .github/workflows/import-v016.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add v0.1.6 precision editing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
