name: Apply Verified G Movement Patch
on:
  push:
    branches: ["feat/v0.1.7-g-endpoint-move"]
    paths: [".github/workflows/import-gmove.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify every byte before applying product code
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          parts=sorted(pathlib.Path('bootstrap/gmove').glob('part*'))
          assert len(parts)==9
          data=b''.join(b''.join(p.read_bytes().split()) for p in parts)
          for p in parts:
              print(p.name,len(p.read_bytes()),hashlib.sha256(p.read_bytes()).hexdigest())
          assert len(data)==38364, len(data)
          raw=base64.b64decode(data,validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='952ce06d7ded18e45992b706d6f693b8303214904a9b340b5204b441763922ab', digest
          pathlib.Path('/tmp/feature.patch').write_bytes(lzma.decompress(raw))
          print('PATCH_SHA256_OK',digest)
          PY
          git apply --check --exclude='.github/workflows/g-move-runtime.yml' /tmp/feature.patch
          git apply --exclude='.github/workflows/g-move-runtime.yml' /tmp/feature.patch
      - name: Run regressions and commit source
        run: |
          set -euo pipefail
          python -m pip install pytest
          python tools/sync_core_into_extension.py
          pytest -q
          python -m compileall -q src extension tools
          rm -rf bootstrap/gmove
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add src/aludiy_core/movement.py extension/aludiy_designer/g_move.py extension/aludiy_designer/vendor/aludiy_core/movement.py tests/core/test_movement.py tests/extension/test_g_move_delivery.py tools/blender_movement_test.py tools/blender_gui_move_test.py tools/blender_reopen_move_test.py docs/acceptance/v0.1.7* docs/progress/v0.1.7-alpha.html
          git commit -m 'feat: add engineering G movement and owned endpoint controls'
          git push origin "HEAD:${GITHUB_REF_NAME}"
