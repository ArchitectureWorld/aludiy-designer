name: Sample Safety Verification
on:
  push:
    branches: ["fix/v0.1.8-sample-safety"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sample-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate runtime resources
        run: |
          python -m pip install pytest
          python tools/sync_core_into_extension.py
      - name: Regression tests
        run: |
          set -o pipefail
          mkdir -p evidence
          pytest -q | tee evidence/pytest.log
      - name: Compile and repeatable build
        run: |
          set -euo pipefail
          python -m compileall -q src extension tools
          python tools/build_extension.py
          P="$(python tools/release_meta.py package-name)"
          cp "dist/$P" "$RUNNER_TEMP/first.zip"
          python tools/build_extension.py
          cmp "$RUNNER_TEMP/first.zip" "dist/$P"
      - name: Retain verification results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-safety-evidence
          path: evidence/
          retention-days: 14
