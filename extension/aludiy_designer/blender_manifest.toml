schema_version = "1.0.0"
id = "aludiy_designer"
version = "0.1.14"
name = "AluDIY Designer"
tagline = "Line-driven aluminum extrusion design with linked 3D feedback"
maintainer = "ArchitectureWorld"
type = "add-on"
license = ["SPDX:GPL-3.0-or-later"]
